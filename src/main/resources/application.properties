spring.datasource.url=jdbc:postgresql://localhost:5432/survey_db
spring.datasource.username=postgres
spring.datasource.password=sgsec!1390
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.application.name=survey-app-backend
server.port=8083

# LDAP (OpenLDAP defaults; override with environment variables in deployment)
# =========================
# LDAP / Active Directory
# موجود در پروژه هست، اینها را کامل‌تر کن
# =========================
spring.ldap.urls=${LDAP_URL:ldap://localhost:389}
spring.ldap.base=${LDAP_BASE_DN:dc=example,dc=org}
spring.ldap.username=${LDAP_BIND_DN:cn=admin,dc=example,dc=org}
spring.ldap.password=${LDAP_BIND_PASSWORD:admin}

# برای login
app.security.ldap.user-dn-pattern=${LDAP_USER_DN_PATTERN:uid={0},ou=people}

# برای sync users
app.ad.user-search-base=${LDAP_USER_SEARCH_BASE:ou=people}
app.ad.user-search-filter=${LDAP_USER_SEARCH_FILTER:(objectClass=person)}

# mapping attributes
app.ad.username-attribute=${LDAP_USERNAME_ATTRIBUTE:uid}
app.ad.first-name-attribute=${LDAP_FIRST_NAME_ATTRIBUTE:givenName}
app.ad.last-name-attribute=${LDAP_LAST_NAME_ATTRIBUTE:sn}
app.ad.display-name-attribute=${LDAP_DISPLAY_NAME_ATTRIBUTE:cn}
app.ad.email-attribute=${LDAP_EMAIL_ATTRIBUTE:mail}
app.ad.employee-id-attribute=${LDAP_EMPLOYEE_ID_ATTRIBUTE:employeeNumber}
app.ad.department-attribute=${LDAP_DEPARTMENT_ATTRIBUTE:department}
app.ad.enabled-attribute=${LDAP_ENABLED_ATTRIBUTE:userAccountControl}


# JWT. Use a long random value (at least 32 bytes) in production.
app.security.jwt.secret=${JWT_SECRET:change-me-in-production-change-me-1234567890}
app.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Browser origins allowed to call the API. Override with a comma-separated
# CORS_ALLOWED_ORIGINS value when the frontend is hosted elsewhere.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Local administrator created at startup when the username does not exist.
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin}

# Initial world-class survey data loaded from surveyQuestions.json.
app.data.survey.title=${INITIAL_SURVEY_TITLE:پرسشنامه کلاس جهانی}
app.data.survey.version=${INITIAL_SURVEY_VERSION:worldclass-v1}
